# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
#   1. Bump "version" in package.json (e.g. 0.2.0) and commit.
#   2. git tag v0.2.0 && git push origin main --tags
# The tag must match package.json. electron-builder uploads the .exe, .blockmap and latest.yml
# (latest.yml is what the in-app updater reads).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # electron-builder uploads artifacts in parallel and, if the release does not exist yet,
      # can race and create duplicates. Creating it first makes every upload reuse the same one.
      - name: Create the release if missing
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
